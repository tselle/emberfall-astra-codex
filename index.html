<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111619" />
    <title>Emberfall · The Emberwild Saga</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="mast">
      <div class="mast-inner">
        <div class="brand">
          <canvas id="sigil" width="36" height="44" aria-hidden="true"></canvas>
          <div>
            <div class="wordmark">Emberfall</div>
            <div class="subtitle">The Emberwild Saga</div>
          </div>
        </div>
        <div class="mast-right">
          <div id="clock"></div>
          <i class="rule"></i
          ><button data-act="menu" class="menu-btn"><span data-icon="menu"></span> Game menu</button>
        </div>
      </div>
    </header>
    <main>
      <div class="chapter">
        <div>
          <span class="chapter-icon" data-icon="banner"></span
          ><span class="chapter-id" id="chapter-id">Adventure E0</span><span class="slash">/</span
          ><span id="adventure-name">The Cellars of Thornwick</span>
        </div>
        <div class="gold"><span data-icon="coins"></span><b id="gold">120</b> GP</div>
      </div>
      <div class="play-layout">
        <section class="explore">
          <div class="scene frame">
            <canvas id="view" width="640" height="326" aria-label="First-person exploration view"></canvas>
            <div class="scene-title">
              <div class="eyebrow"><span class="live-light"></span><span id="biome">Settlement</span></div>
              <h1 id="location">Thornwick</h1>
            </div>
            <div class="bearing" id="bearing"></div>
            <div class="scene-caption">
              <span data-icon="pin"></span><span id="scene-caption">Market street</span>
            </div>
            <button id="interact" data-act="interact" title="Interact with the square ahead">
              Interact <kbd>↵</kbd></button
            ><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i
            ><i class="corner br"></i>
          </div>
          <div class="readouts">
            <div class="mini-panel panel">
              <div class="panel-title">
                <span data-icon="map"></span> Area map<button
                  class="icon-only"
                  data-act="map"
                  title="Expand area map"
                  aria-label="Expand area map"
                  data-icon="expand"
                ></button>
              </div>
              <canvas id="minimap" width="208" height="101" aria-label="Local area map"></canvas>
            </div>
            <section class="log-panel panel">
              <div class="panel-title"><span data-icon="quill"></span> Expedition log</div>
              <div id="log" role="log"></div>
            </section>
          </div>
        </section>
        <aside class="party panel">
          <div class="panel-title party-title">
            <span data-icon="company"></span>
            <h2>Your company</h2>
            <span class="count" id="party-count">6 / 6</span>
          </div>
          <div id="roster"></div>
        </aside>
      </div>
      <div class="command-panel panel">
        <div class="cmd-label">Commands</div>
        <div id="commands"></div>
      </div>
      <nav id="library" aria-label="Reference and campaign"></nav>
      <footer>
        <span class="foot-mark">✧</span><span><kbd>W A S D</kbd> Move & turn</span
        ><span><kbd>Q E</kbd> Sidestep</span><span><kbd>1–6</kbd> Character sheet</span
        ><span class="footer-right" id="save-status"></span>
      </footer>
      <div id="touchpad"></div>
    </main>
    <dialog id="dialog">
      <div class="modal-head">
        <div>
          <div class="eyebrow" id="modal-tag"></div>
          <h2 id="modal-title"></h2>
        </div>
        <button class="close" data-act="close" aria-label="Close dialog" aria-keyshortcuts="Tab" title="Close (Tab)"><kbd>Tab</kbd></button>
      </div>
      <div id="modal-body"></div>
    </dialog>
    <script src="rules.js"></script>
    <script src="data.js"></script>
    <script src="modules.js"></script>
    <script src="monsters.js"></script>
    <script src="wilds.js"></script>
    <script src="treasure.js"></script>
    <script src="adventures.js"></script>
    <script src="figures.js"></script>
    <script src="view3d.js"></script>
    <script src="ui.js"></script>
    <script src="attack-fx.js"></script>
    <script src="combat.js"></script>
    <script src="overland.js"></script>
    <script src="campaign.js"></script>
    <script src="journal.js"></script>
    <script src="map.js"></script>
    <script src="bestiary.js"></script>
    <script src="navpad.js"></script>
    <script src="watch.js"></script>
    <script src="game.js"></script>
  </body>
</html>
